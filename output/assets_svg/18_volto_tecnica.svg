<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 900 405" width="900" height="405" font-family="Montserrat, 'Liberation Sans', 'DejaVu Sans', sans-serif"><defs><marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#4A8CFF"/></marker><marker id="ahd" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#003BA3"/></marker></defs><rect x="24.0" y="22.0" width="244.0" height="300.0" rx="16" ry="16" fill="#F5F7FA"/><rect x="24.0" y="22.0" width="244.0" height="44.0" rx="16" ry="16" fill="#E8EEF7"/><rect x="24.0" y="46.0" width="244.0" height="20.0" rx="0" ry="0" fill="#E8EEF7"/><text x="146.0" y="50.0" font-size="11.5" fill="#003BA3" font-weight="800" text-anchor="middle">LA TECNICA NON È NEUTRALE</text><text x="146.0" y="94.0" font-size="13.5" fill="#1A1A2E" font-weight="600" text-anchor="middle" font-style="italic">«Assume il volto</text><text x="146.0" y="117.0" font-size="13.5" fill="#1A1A2E" font-weight="600" text-anchor="middle" font-style="italic">di chi la pensa,</text><text x="146.0" y="140.0" font-size="13.5" fill="#1A1A2E" font-weight="600" text-anchor="middle" font-style="italic">la finanzia, la regola,</text><text x="146.0" y="163.0" font-size="13.5" fill="#1A1A2E" font-weight="600" text-anchor="middle" font-style="italic">la usa»</text><text x="146.0" y="204.0" font-size="9.5" fill="#5A6072" font-weight="600" text-anchor="middle">Leone XIV · Magnifica Humanitas · §9</text><line x1="46.0" y1="220.0" x2="246.0" y2="220.0" stroke="#D5DEEC" stroke-width="1" stroke-linecap="round"/><text x="146.0" y="246.0" font-size="13.5" fill="#1A1A2E" font-weight="600" text-anchor="middle" font-style="italic">«chi detenga il potere</text><text x="146.0" y="269.0" font-size="13.5" fill="#1A1A2E" font-weight="600" text-anchor="middle" font-style="italic">e a quali fini lo orienti»</text><text x="146.0" y="304.0" font-size="9.5" fill="#5A6072" font-weight="600" text-anchor="middle">Leone XIV · Magnifica Humanitas · §5</text><line x1="272.0" y1="172.0" x2="300.0" y2="172.0" stroke="#003BA3" stroke-width="4" marker-end="url(#ah)" stroke-linecap="round"/><rect x="304.0" y="22.0" width="292.0" height="300.0" rx="16" ry="16" fill="#EAF1FF" stroke="#4A8CFF" stroke-width="2"/><rect x="304.0" y="22.0" width="292.0" height="44.0" rx="16" ry="16" fill="#4A8CFF"/><rect x="304.0" y="46.0" width="292.0" height="20.0" rx="0" ry="0" fill="#4A8CFF"/><text x="450.0" y="50.0" font-size="11.5" fill="#FFFFFF" font-weight="800" text-anchor="middle">IL DOMINIO DELL'ARCHITETTURA</text><rect x="345.0" y="100.0" width="210.0" height="36.0" rx="8" ry="8" fill="#003BA3"/><text x="450.0" y="122.9" font-size="14" fill="#FFFFFF" font-weight="800" text-anchor="middle">ARCHITETTURA</text><rect x="345.0" y="150.0" width="210.0" height="36.0" rx="8" ry="8" fill="#003BA3"/><text x="450.0" y="172.9" font-size="14" fill="#FFFFFF" font-weight="800" text-anchor="middle">DOMINIO</text><rect x="345.0" y="200.0" width="210.0" height="36.0" rx="8" ry="8" fill="#003BA3"/><text x="450.0" y="222.9" font-size="14" fill="#FFFFFF" font-weight="800" text-anchor="middle">STRATEGIA</text><text x="450.0" y="294.0" font-size="11.5" fill="#1A1A2E" font-weight="600" text-anchor="middle" font-style="italic">i tre cardini = il volto che le diamo</text><line x1="600.0" y1="172.0" x2="628.0" y2="172.0" stroke="#003BA3" stroke-width="4" marker-end="url(#ah)" stroke-linecap="round"/><rect x="632.0" y="22.0" width="244.0" height="300.0" rx="16" ry="16" fill="#003BA3"/><text x="754.0" y="62.0" font-size="16" fill="#FFFFFF" font-weight="800" text-anchor="middle">ORIENTATA</text><text x="754.0" y="84.0" font-size="16" fill="#9EC2FF" font-weight="800" text-anchor="middle">ALLA PERSONA</text><circle cx="654.0" cy="128.0" r="3.0" fill="#9EC2FF"/><text x="666.0" y="132.0" font-size="12.5" fill="#FFFFFF" font-weight="800" text-anchor="start">Gate</text><text x="666.0" y="148.0" font-size="11" fill="#9EC2FF" font-weight="500" text-anchor="start">il giudizio umano</text><text x="666.0" y="163.0" font-size="11" fill="#9EC2FF" font-weight="500" text-anchor="start">resta centrale</text><circle cx="654.0" cy="186.0" r="3.0" fill="#9EC2FF"/><text x="666.0" y="190.0" font-size="12.5" fill="#FFFFFF" font-weight="800" text-anchor="start">Dominio</text><text x="666.0" y="206.0" font-size="11" fill="#9EC2FF" font-weight="500" text-anchor="start">responsabilità</text><text x="666.0" y="221.0" font-size="11" fill="#9EC2FF" font-weight="500" text-anchor="start">codificata</text><circle cx="654.0" cy="244.0" r="3.0" fill="#9EC2FF"/><text x="666.0" y="248.0" font-size="12.5" fill="#FFFFFF" font-weight="800" text-anchor="start">Strategia</text><text x="666.0" y="264.0" font-size="11" fill="#9EC2FF" font-weight="500" text-anchor="start">l'uomo dove</text><text x="666.0" y="279.0" font-size="11" fill="#9EC2FF" font-weight="500" text-anchor="start">aggiunge giudizio</text><rect x="24.0" y="332.0" width="852.0" height="62.0" rx="16" ry="16" fill="#003BA3"/><text x="450.0" y="358.0" font-size="15.5" fill="#FFFFFF" font-weight="800" text-anchor="middle">Solo con il controllo dell'architettura, la conoscenza del dominio</text><text x="450.0" y="381.0" font-size="15.5" fill="#FFFFFF" font-weight="800" text-anchor="middle">e una strategia consapevole la si orienta verso la persona</text></svg>