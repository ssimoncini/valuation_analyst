<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 900 405" width="900" height="405" font-family="Montserrat, 'Liberation Sans', 'DejaVu Sans', sans-serif"><defs><marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#4A8CFF"/></marker><marker id="ahd" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#003BA3"/></marker></defs><rect x="120.0" y="16.0" width="660.0" height="40.0" rx="10" ry="10" fill="#1A1A2E"/><text x="450.0" y="42.0" font-size="15" fill="#FFFFFF" font-weight="700" text-anchor="middle">PROMPT:  “Valuta il Terminal Value di questa azienda”</text><rect x="30.0" y="78.0" width="390.0" height="300.0" rx="16" ry="16" fill="#F5F7FA"/><text x="225.0" y="110.0" font-size="16" fill="#5A6072" font-weight="800" text-anchor="middle">IA GENERICA</text><text x="225.0" y="138.0" font-size="14" fill="#1A1A2E" font-weight="700" text-anchor="middle">TV = FCF·(1+g)/(WACC−g)</text><text x="225.0" y="162.0" font-size="15" fill="#1A1A2E" font-weight="800" text-anchor="middle">TV = 2.472M</text><rect x="70.0" y="196.0" width="310.0" height="150.0" rx="12" ry="12" fill="#FFFFFF" stroke="#D5DEEC" stroke-width="1.5"/><text x="225.0" y="232.0" font-size="14" fill="#1A1A2E" font-weight="600" text-anchor="middle">“Il Terminal Value</text><text x="225.0" y="254.0" font-size="14" fill="#1A1A2E" font-weight="600" text-anchor="middle">è 2.472M.”</text><text x="225.0" y="300.0" font-size="13" fill="#5A6072" font-weight="600" text-anchor="middle" font-style="italic">Matematicamente corretto</text><text x="225.0" y="320.0" font-size="13" fill="#D64550" font-weight="700" text-anchor="middle" font-style="italic">professionalmente inutile</text><rect x="480.0" y="78.0" width="390.0" height="300.0" rx="16" ry="16" fill="#EAF1FF" stroke="#4A8CFF" stroke-width="2"/><text x="675.0" y="110.0" font-size="16" fill="#003BA3" font-weight="800" text-anchor="middle">IA CON DOMINIO</text><text x="675.0" y="134.0" font-size="13" fill="#1A1A2E" font-weight="700" text-anchor="middle">TV = NOPAT·(1−g/ROIC)/(wacc−g)</text><text x="505.0" y="162.0" font-size="15" fill="#2E9E5B" font-weight="800" text-anchor="start">✓</text><text x="525.0" y="162.0" font-size="12.5" fill="#1A1A2E" font-weight="600" text-anchor="start">ROIC nuovi inv. 12% &gt; WACC 8%</text><text x="505.0" y="188.0" font-size="15" fill="#D64550" font-weight="800" text-anchor="start">✗</text><text x="525.0" y="188.0" font-size="12.5" fill="#1A1A2E" font-weight="600" text-anchor="start">Peso TV su EV: 82% — anomalo (&gt;75%)</text><text x="505.0" y="214.0" font-size="15" fill="#D64550" font-weight="800" text-anchor="start">✗</text><text x="525.0" y="214.0" font-size="12.5" fill="#1A1A2E" font-weight="600" text-anchor="start">g 3% &gt; PIL Italia 1,5% — rivedere</text><rect x="505.0" y="250.0" width="340.0" height="96.0" rx="12" ry="12" fill="#FFFFFF" stroke="#4A8CFF" stroke-width="1.5"/><text x="675.0" y="276.0" font-size="12.5" fill="#1A1A2E" font-weight="600" text-anchor="middle">“TV = 1.890M ma due check falliti.</text><text x="675.0" y="296.0" font-size="12.5" fill="#1A1A2E" font-weight="600" text-anchor="middle">Raccomando: ridurre g a 1,5%.</text><text x="675.0" y="322.0" font-size="13" fill="#003BA3" font-weight="800" text-anchor="middle">Procedo o rivediamo?”</text></svg>